name: Add relatives fields to candidate card

on:
  push:
    branches: [main]
    paths:
      - 'candidate-card-v2.js'
      - '.github/workflows/add-relatives-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add relatives fields to candidate card') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch candidate card
        shell: python
        run: |
          from pathlib import Path
          p = Path('candidate-card-v2.js')
          s = p.read_text(encoding='utf-8')

          if 'id="ccRelatives"' in s:
              print('Relatives UI already present; nothing to do.')
              raise SystemExit(0)

          old = '''  function textarea(label, name, value, cls = '') {
    return `<div class="cc-field ${cls}"><label>${esc(label)}</label><textarea name="${esc(name)}" rows="4">${esc(value || '')}</textarea></div>`;
  }
'''
          new = old + '''
  const RELATIONSHIP_OPTIONS = ['Батько','Мати','Чоловік','Дружина','Син','Донька','Брат','Сестра','Інше'];

  function relativeRow(item = {}, index = 0) {
    const opts = RELATIONSHIP_OPTIONS.map(x => `<option value="${esc(x)}" ${x === (item.relationship || '') ? 'selected' : ''}>${esc(x)}</option>`).join('');
    return `<div class="cc-relative-row" data-relative-row="${index}">
      <div class="cc-relative-head"><strong>Близький родич</strong><button type="button" class="cc-relative-remove" data-remove-relative>Видалити</button></div>
      <div class="cc-grid">
        ${select('Ступінь споріднення','relationship','', [['','Оберіть'], ...RELATIONSHIP_OPTIONS.map(x=>[x,x])])}
        ${input('ПІБ','full_name',item.full_name || '')}
        ${input('Дата народження','birth_date',item.birth_date || '','date')}
        ${input('Місце народження','birth_place',item.birth_place || '')}
        ${input('Громадянство','citizenship',item.citizenship || '')}
        ${input('Місце проживання','address',item.address || '','text','cc-wide')}
        ${input('Телефон','phone',item.phone || '')}
        ${input('Місце роботи','workplace',item.workplace || '')}
        ${input('Посада','position',item.position || '')}
        ${textarea('Примітки','notes',item.notes || '','cc-wide')}
      </div>
    </div>`;
  }
'''
          if old not in s:
              raise SystemExit('Could not find textarea helper marker')
          s = s.replace(old, new, 1)

          s = s.replace(
              "    const docs = dr.data || [];\n",
              "    const docs = dr.data || [];\n    const relatives = Array.isArray(profile.relatives) ? profile.relatives : [];\n",
              1
          )

          css_old = '''        .cc-hint{padding:11px 13px;background:#f7faed;border:1px solid #dce8b7;border-radius:8px;color:#68757d;font-size:11px;margin-bottom:14px}.cc-empty{text-align:center;color:#89959c;padding:18px}.cc-badge{padding:5px 9px;border-radius:12px;background:#e8f2cc;color:#5d741f;font-size:10px;font-weight:800}
'''
          css_new = css_old.replace(
              '.cc-badge{padding:5px 9px;border-radius:12px;background:#e8f2cc;color:#5d741f;font-size:10px;font-weight:800}',
              '.cc-badge{padding:5px 9px;border-radius:12px;background:#e8f2cc;color:#5d741f;font-size:10px;font-weight:800}.cc-relative-row{border:1px solid #dfe6e9;border-radius:10px;padding:14px;margin-bottom:12px;background:#fbfcfc}.cc-relative-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#44515a}.cc-relative-remove{border:1px solid #e1caca!important;background:#fff!important;color:#96504e!important;padding:6px 9px!important;font-size:11px}.cc-relative-add{margin-top:4px;border:1px solid #cfd8dc!important;background:#f7f9f9!important;color:#45525a!important}'
          )
          if css_old not in s:
              raise SystemExit('Could not find CSS marker')
          s = s.replace(css_old, css_new, 1)

          docs_marker = '''        <section class="cc-section"><div class="cc-section-head"><div><h3>13. Документи кандидата</h3><small>Завантажені документи та їхній поточний статус.</small></div><span class="cc-badge">${docs.length} документ(ів)</span></div><div class="cc-docs">${documentRows}</div></section>'''
          docs_replacement = '''        <section class="cc-section"><div class="cc-section-head"><div><h3>13. Близькі родичі</h3><small>Батько, мати, чоловік/дружина, діти, брати, сестри та інші близькі родичі.</small></div><span class="cc-badge">${relatives.length} запис(ів)</span></div>
          <div id="ccRelatives">${(relatives.length ? relatives : [{},{}]).map((r,i)=>relativeRow(r,i)).join('')}</div>
          <button type="button" id="ccAddRelative" class="cc-relative-add">＋ Додати родича</button>
        </section>
        <section class="cc-section"><div class="cc-section-head"><div><h3>14. Документи кандидата</h3><small>Завантажені документи та їхній поточний статус.</small></div><span class="cc-badge">${docs.length} документ(ів)</span></div><div class="cc-docs">${documentRows}</div></section>'''
          if docs_marker not in s:
              raise SystemExit('Could not find documents section marker')
          s = s.replace(docs_marker, docs_replacement, 1)

          templates_marker = '''        <section class="cc-section"><div class="cc-section-head"><div><h3>14. Бланки CRM</h3>'''
          if templates_marker not in s:
              raise SystemExit('Could not find templates section marker')
          s = s.replace(templates_marker, '''        <section class="cc-section"><div class="cc-section-head"><div><h3>15. Бланки CRM</h3>''', 1)

          bind_marker = '''    content.querySelectorAll('[data-template-key]').forEach(b => b.addEventListener('click', () => alert('Бланк «' + b.textContent.replace(/^📝\\s*/, '') + '» підключимо після завантаження затвердженого шаблону.')));
'''
          bind_new = bind_marker + '''
    const relBox = content.querySelector('#ccRelatives');
    const addRelativeButton = content.querySelector('#ccAddRelative');
    let relativeIndex = relBox ? relBox.querySelectorAll('[data-relative-row]').length : 0;
    addRelativeButton?.addEventListener('click', () => {
      relBox.insertAdjacentHTML('beforeend', relativeRow({}, relativeIndex++));
    });
    relBox?.addEventListener('click', event => {
      const remove = event.target.closest('[data-remove-relative]');
      if (!remove) return;
      const row = remove.closest('[data-relative-row]');
      row?.remove();
    });
'''
          if bind_marker not in s:
              raise SystemExit('Could not find event binding marker')
          s = s.replace(bind_marker, bind_new, 1)

          save_marker = '''      profileKeys.forEach(k => { if (fd.has(k)) oldProfile[k] = fd.get(k); });
'''
          save_new = save_marker + '''
      const savedRelatives = [...form.querySelectorAll('[data-relative-row]')].map(row => {
        const get = key => row.querySelector(`[name="${key}"]`)?.value?.trim() || '';
        return {
          relationship: get('relationship'), full_name: get('full_name'), birth_date: get('birth_date'),
          birth_place: get('birth_place'), citizenship: get('citizenship'), address: get('address'),
          phone: get('phone'), workplace: get('workplace'), position: get('position'), notes: get('notes')
        };
      }).filter(r => Object.values(r).some(Boolean));
      oldProfile.relatives = savedRelatives;
'''
          if save_marker not in s:
              raise SystemExit('Could not find save marker')
          s = s.replace(save_marker, save_new, 1)

          p.write_text(s, encoding='utf-8')
          print('Candidate card patched successfully.')
      
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-card-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Add relatives fields to candidate card"
          git push
