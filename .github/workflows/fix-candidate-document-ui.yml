name: Fix candidate document UI

on:
  push:
    paths:
      - 'deploy-document-route.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch documents.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('documents.js')
          s = p.read_text(encoding='utf-8')

          old = "const AI_DOC_FUNCTION='ai-classify-document';"
          new = "const AI_DOC_FUNCTION='process-id-document';"
          if old not in s:
              raise SystemExit('Expected AI_DOC_FUNCTION declaration not found')
          s = s.replace(old, new, 1)

          pattern = r"async function classifyStoredDocument\(path,fileName,extractedText=''\)\{.*?\}\nfunction normName"
          replacement = """async function classifyStoredDocument(path,fileName,extractedText=''){
          const{data:doc,error:de}=await supabaseClient.from('documents').select('id').eq('storage_path',path).maybeSingle();
          if(de||!doc?.id)throw new Error(de?.message||'Не знайдено запис документа для AI');
          const{data:ai,error:aiError}=await supabaseClient.functions.invoke(AI_DOC_FUNCTION,{body:{document_id:doc.id}});
          if(aiError)throw new Error(aiError.message||'Помилка AI');
          if(!ai?.ok&&!ai?.extracted)throw new Error(ai?.error||'AI не повернув структуровані дані');
          return ai
          }
          function normName"""
          s2,n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected classifyStoredDocument block not found; matches={n}')
          s = s2

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify route
        run: |
          grep -n "AI_DOC_FUNCTION" documents.js
          grep -n "process-id-document" documents.js
          grep -n "document_id:doc.id" documents.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents.js
          git diff --cached --quiet && exit 0
          git commit -m 'Route document AI through process-id-document'
          git push
