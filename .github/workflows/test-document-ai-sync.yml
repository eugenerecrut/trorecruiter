name: Document AI synchronization regression
on:
  pull_request:
  push:
    branches: [main, codex/ai-document-sync]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run synchronization and existing CRM regressions
        run: |
          node --test tests/crm-candidate-facts.cjs
          node --test tests/crm-candidate-case-view.cjs tests/crm-personal-file-cas.cjs
          node --test tests/crm-splav-server-sync.cjs tests/crm-splav-result-consistency.cjs tests/crm-review-source.cjs tests/crm-review-decision-body.cjs tests/crm-diploma-owner.cjs tests/crm-review-structured.cjs tests/crm-relative-completion.cjs tests/crm-large-pdf.cjs tests/crm-period-links.cjs tests/crm-document-crosscheck.cjs tests/crm-military-autopilot.cjs tests/crm-military-zone.cjs tests/crm-relative-name-case.cjs tests/crm-auth-navigation.cjs tests/crm-biography-facts.cjs tests/crm-anketa-size.cjs tests/crm-document-ai-sync.cjs tests/crm-edge-document-id.cjs tests/crm-upload-pipeline.cjs tests/crm-service-readiness.cjs tests/crm-field-registry.cjs tests/crm-military-facts.cjs tests/crm-record-append.cjs tests/crm-intake-activity.cjs tests/crm-dashboard-document-status.cjs tests/crm-case-assistant.cjs
          node tests/crm-audit.cjs
          node tests/crm-interface.cjs
          node tests/crm-card-v3.cjs
          node tests/crm-mobilization.cjs
          node tests/crm-education-summary.cjs
          node tests/crm-education-fields.cjs
          node tests/crm-archive-path.cjs
      - name: Install isolated PostgreSQL test runtime
        run: npm ci --prefix tests/sql-runtime --ignore-scripts
      - name: Verify source-bound decisions in isolated PostgreSQL
        run: node tests/crm-review-source-sql.cjs
