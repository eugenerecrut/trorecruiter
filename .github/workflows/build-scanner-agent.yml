name: Build PSK Scanner Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner_agent_windows.go'
      - '.github/workflows/build-scanner-agent.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build EXE
        shell: pwsh
        run: $env:GOOS='windows'; $env:GOARCH='amd64'; go build -ldflags='-s -w' -o PSK_Scanner_Agent.exe scanner_agent_windows.go
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PSK_Scanner_Agent_Windows
          path: PSK_Scanner_Agent.exe
          if-no-files-found: error
