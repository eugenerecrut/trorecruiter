name: Build PSK Scanner Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'scanner_agent.py'
      - 'requirements.txt'
      - 'PSK_Scanner_Agent.spec'
      - '.github/workflows/build-scanner-agent.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --clean PSK_Scanner_Agent.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PSK_Scanner_Agent_Windows
          path: dist/PSK_Scanner_Agent.exe
          if-no-files-found: error
