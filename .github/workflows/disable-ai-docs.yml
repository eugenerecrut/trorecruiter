name: Disable AI document classification

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/disable-ai-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace AI document classifier with OCR rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('documents.js')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace("const AI_DOC_FUNCTION='ai-classify-document';", "const AI_DOC_FUNCTION=null;")
          s = s.replace("forced?.document_type||'Обробка AI'", "forced?.document_type||'Документ'")
          s = s.replace('AI визначить автоматично', 'Тип буде визначено за OCR')
          s = s.replace("<th>AI</th>", "<th>Розпізнавання</th>")
          s = s.replace('AI розпізнано · перевірити', 'Розпізнано · перевірити')

          start = s.find("async function classifyStoredDocument(")
          end = s.find("\nfunction normName", start)
          if start == -1 or end == -1:
              raise SystemExit('classifyStoredDocument markers not found')

          replacement = r'''async function classifyStoredDocument(path,fileName,extractedText=''){
            const text=String(extractedText||'').replace(/\\s+/g,' ').trim();
            const hay=(String(fileName||'')+' '+text).toLowerCase();
            const numbers=text.match(/\\b\\d{10}\\b/g)||[];
            const rnokpp=numbers.find(v=>{const d=v.split('').map(Number),w=[1,2,3,4,5,6,7,8,9];const c=w.reduce((a,x,i)=>a+d[i]*x,0)%11;return c<10&&c===d[9]})||numbers[0]||null;
            const taxCard=hay.includes('картка платника податків')||hay.includes('реєстраційний номер облікової картки платника податків')||hay.includes('реєстраційний номер облікової картки')||hay.includes('податковий номер')||/\\bрнокпп\\b/i.test(hay)||/\\bіпн\\b/i.test(hay);
            return {document_type:taxCard?'Картка платника податків':null,confidence:taxCard?1:0,extracted:{rnokpp},warnings:taxCard?(rnokpp?[]:['РНОКПП не знайдено в OCR']):['Тип документа не визначено правилами OCR']};
          }'''
          s = s[:start] + replacement + s[end:]

          if s == original:
              print('No changes needed')
          else:
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documents.js
          git commit -m "Use OCR rules instead of AI for document classification"
          git push