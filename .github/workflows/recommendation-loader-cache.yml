name: Load latest recommendation AI module

on:
  push:
    paths:
      - 'recommendation-loader-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inject latest recommendation module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="recommendation-upload-fix.js?v=20260930-ai5"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in index.html')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load latest recommendation AI module'
          git push
