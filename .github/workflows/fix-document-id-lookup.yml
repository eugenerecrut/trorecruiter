name: Fix document ID lookup
on:
  push:
    branches: [main]
    paths:
      - 'documents.js'
      - '.github/workflows/fix-document-id-lookup.yml'
permissions:
  contents: write
jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'fix: document lookup by id')"
    runs-on: ubuntu-latest
    steps:
      - name: Patch documents.js through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'documents.js';
            const current = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const sha = current.data.sha;
            let text = Buffer.from(current.data.content, 'base64').toString('utf8');
            const old1 = "async function classifyStoredDocument(path,fileName,extractedText=''){\nconst{data:doc,error:de}=await supabaseClient.from('documents').select('id').eq('storage_path',path).maybeSingle();\nif(de||!doc?.id)throw new Error(de?.message||'Не знайдено запис документа для AI');\nconst{data:ai,error:aiError}=await supabaseClient.functions.invoke(AI_DOC_FUNCTION,{body:{document_id:doc.id}});";
            const new1 = "async function classifyStoredDocument(documentId,path,fileName,extractedText=''){\nif(!documentId)throw new Error('Не передано ID документа для AI');\nconst doc={id:documentId};\nconst{data:ai,error:aiError}=await supabaseClient.functions.invoke(AI_DOC_FUNCTION,{body:{document_id:doc.id}});";
            if (!text.includes(old1)) core.setFailed('Expected classifyStoredDocument block not found');
            text = text.replace(old1, new1);
            const old2 = 'ai=await classifyStoredDocument(path,file.name,documentText)';
            const new2 = 'ai=await classifyStoredDocument(document.id,path,file.name,documentText)';
            if (!text.includes(old2)) core.setFailed('Expected classifyStoredDocument call not found');
            text = text.replace(old2, new2);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, message: 'fix: document lookup by id', content: Buffer.from(text, 'utf8').toString('base64'), sha, branch: 'main'
            });
