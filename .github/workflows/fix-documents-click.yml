name: Fix Documents click
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch documents.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('documents.js')
          s=p.read_text(encoding='utf-8')
          marker='// PSK_RECRUTER: documents menu fallback'
          if marker not in s:
              s += '''\n\n<script-never-used>\n'''
              s=s.replace('<script-never-used>\n','')
              s += '''\n// PSK_RECRUTER: documents menu fallback\n(function(){\n  function bind(){\n    const items=[...document.querySelectorAll('.sidebar .menu-item')];\n    const item=items.find(x=>x.textContent.replace(/\\s/g,'').includes('▣Документи'));\n    if(!item)return false;\n    item.onclick=function(e){e.preventDefault();e.stopPropagation();if(typeof showCandidates==='function')showCandidates();};\n    return true;\n  }\n  if(!bind()) setTimeout(bind,500);\n})();\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit on current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documents.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Documents menu click"
          git push origin HEAD:main
      - name: Remove fixer
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git rm .github/workflows/fix-documents-click.yml || true
          git commit -m "Remove Documents fixer" || true
          git push origin HEAD:main || true
