name: Bust recommendation AI cache

on:
  push:
    paths:
      - 'recommendation-ai-cache-bust.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update script cache-buster
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="recommendation-upload-fix.js"></script>'
          new = '<script src="recommendation-upload-fix.js?v=20260930-ai4"></script>'
          if old not in s:
              raise SystemExit('recommendation script tag not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust recommendation AI script cache'
          git push
