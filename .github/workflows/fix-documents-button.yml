name: Fix Documents button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip documents-button]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Documents button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="menu-item">▣ &nbsp;Документи</div>'
          new = '<div class="menu-item" onclick="showCandidates()">▣ &nbsp;Документи</div>'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Target Documents button not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Documents button [skip documents-button]"
          git push
