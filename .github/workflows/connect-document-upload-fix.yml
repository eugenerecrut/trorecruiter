name: Restore document menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Documents menu handlers
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('onclick="showDocuments()">▣ &nbsp;Документи', 'onclick="showCandidates()">▣ &nbsp;Документи', 1)
          s = s.replace('onclick="showDocuments()">▣ Документи', 'onclick="showCandidates()">▣ Документи', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Restore Documents menu behavior"; git push; fi
