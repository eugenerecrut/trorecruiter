# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject local OCR bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ocr-local-only.js"></script>'
          if tag not in s:
              marker = '<script src="delete-candidate.js?v=3"></script>'
              if marker in s:
                  s = s.replace(marker, marker + '\n' + tag)
              else:
                  s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Inject document type field
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="document-type-field.js"></script>'
          if not re.search(r'<script\s+src=["\']document-type-field\.js(?:\?[^"\']*)?["\']></script>', s):
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
