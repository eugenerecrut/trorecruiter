# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject local OCR bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="ocr-local-only.js"></script>'
          if tag not in s:
              marker = '<script src="delete-candidate.js?v=3"></script>'
              if marker in s:
                  s = s.replace(marker, marker + '\n' + tag)
              else:
                  s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Inject document type field
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="document-type-field.js"></script>'
          if not re.search(r'<script\s+src=["\']document-type-field\.js(?:\?[^"\']*)?["\']></script>', s):
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{os.environ['GH_RUN_ID']}/artifacts?per_page=100"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(8):
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response)['artifacts']
              matches = [a for a in artifacts if a['name'] == os.environ['GH_ARTIFACT_NAME'] and not a['expired']]
              if len(matches) == 1:
                  print('Pages artifact metadata is available.')
                  break
              if len(matches) > 1:
                  raise SystemExit('Duplicate Pages artifacts in this attempt.')
              if attempt == 7:
                  raise SystemExit('Pages artifact metadata did not become available.')
              time.sleep(5)
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
