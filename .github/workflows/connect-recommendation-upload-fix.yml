name: Connect recommendation upload fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect current recommendation AI bridge
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove every legacy/duplicate recommendation uploader include.
          s=re.sub(r'<script\s+src=["\']recommendation-upload-fix\.js(?:\?[^"\']*)?["\']></script>\s*', '', s)
          marker='</body>'
          if marker not in s: raise SystemExit('Cannot find </body>')
          tags=(
              '<script src="recommendation-upload-fix.js?v=20260930-ai5"></script>\n'
              '<script src="ai-recommendation-bridge.js?v=20260930-ai1"></script>\n'
          )
          s=s.replace(marker,tags+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "connect current recommendation AI bridge"; git push; fi
