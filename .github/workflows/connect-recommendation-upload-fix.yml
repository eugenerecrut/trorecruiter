name: Connect recommendation upload fix
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect current recommendation AI bridge
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          uploader=re.search(r'<script\s+src=["\']recommendation-upload-fix\.js(?:\?[^"\']*)?["\']></script>', s)
          bridge=re.search(r'<script\s+src=["\']ai-recommendation-bridge\.js(?:\?[^"\']*)?["\']></script>', s)
          # Preserve installed release URLs while removing duplicate includes.
          s=re.sub(r'<script\s+src=["\']recommendation-upload-fix\.js(?:\?[^"\']*)?["\']></script>\s*', '', s)
          # The bridge must be single and follow its uploader.
          s=re.sub(r'<script\s+src=["\']ai-recommendation-bridge\.js(?:\?[^"\']*)?["\']></script>\s*', '', s)
          marker='</body>'
          if marker not in s: raise SystemExit('Cannot find </body>')
          tags=(uploader.group(0) if uploader else '<script src="recommendation-upload-fix.js?v=1.0.0.344"></script>')+'\n'
          tags+=(bridge.group(0) if bridge else '<script src="ai-recommendation-bridge.js?v=20261002-ux1"></script>')+'\n'
          s=s.replace(marker,tags+marker,1)
          p.write_text(s,encoding='utf-8')
