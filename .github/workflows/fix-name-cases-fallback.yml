name: Fix name cases fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip name-cases-fallback]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add local Ukrainian declension fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('script.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* PSK_NAME_CASES_FALLBACK_V2 */'
          if marker in text:
              print('Fallback already present')
              raise SystemExit(0)

          old = """    const cases = getNameCases(parsed);\n    const labels = ["""
          new = r'''    const cases = (() => {
              const base = getNameCases(parsed);
              if (base.genitive || base.dative || base.accusative || base.instrumental || base.locative || base.vocative) return base;

              const full = String(base.nominative || '').trim();
              const parts = full.split(/\s+/);
              if (parts.length < 2) return base;

              const surname = parts[0];
              const first = parts[1];
              const patronymic = parts[2] || '';
              const low = s => String(s || '').toLocaleLowerCase('uk-UA');
              const gender = /(?:івна|ївна|овна|евна|євна)$/.test(low(patronymic)) ? 'female' :
                             /(?:ович|евич|євич|йович|ич)$/.test(low(patronymic)) ? 'male' : '';

              const nameMaps = {
                ростислав:['ростислав','ростислава','ростиславу','ростислава','ростиславом','ростиславі','ростиславе'],
                сергій:['сергій','сергія','сергію','сергія','сергієм','сергії','сергію'],
                олександр:['олександр','олександра','олександру','олександра','олександром','олександрі','олександре'],
                микола:['микола','миколи','миколі','миколу','миколою','миколі','миколо'],
                іван:['іван','івана','івану','івана','іваном','івані','іване'],
                дмитро:['дмитро','дмитра','дмитру','дмитра','дмитром','дмитрі','дмитре'],
                євген:['євген','євгена','євгену','євгена','євгеном','євгені','євгене'],
                андрій:['андрій','андрія','андрію','андрія','андрієм','андрію','андрію'],
                олексій:['олексій','олексія','олексію','олексія','олексієм','олексії','олексію'],
                юрій:['юрій','юрія','юрію','юрія','юрієм','юрії','юрію'],
                павло:['павло','павла','павлу','павла','павлом','павлі','павле']
              };

              function firstDecl(s) {
                const x=low(s);
                if (nameMaps[x]) return nameMaps[x];
                if (/й$/.test(x)) { const b=x.slice(0,-1); return [x,b+'я',b+'ю',b+'я',b+'єм',b+'ї',b+'ю']; }
                if (/о$/.test(x)) { const b=x.slice(0,-1); return [x,b+'а',b+'у',b+'а',b+'ом',b+'і',b+'е']; }
                return [x,x+'а',x+'у',x+'а',x+'ом',x+'і',x+'е'];
              }

              function surnameDecl(s) {
                const x=low(s);
                if (gender === 'female' && /(?:ова|ева|єва|іна|їна|ая|я)$/.test(x)) {
                  if (/[ая]$/.test(x)) { const b=x.slice(0,-1); return [x,b+(x.endsWith('я')?'і':'и'),b+'і',b+(x.endsWith('я')?'ю':'у'),b+(x.endsWith('я')?'єю':'ою'),b+'і',b+(x.endsWith('я')?'є':'о')]; }
                }
                if (gender === 'male' && /[ая]$/.test(x)) {
                  const b=x.slice(0,-1); return [x,b+(x.endsWith('я')?'і':'и'),b+'і',b+(x.endsWith('я')?'ю':'у'),b+(x.endsWith('я')?'єю':'ою'),b+'і',b+(x.endsWith('я')?'є':'о')];
                }
                if (gender === 'male' && /й$/.test(x)) { const b=x.slice(0,-1); return [x,b+'я',b+'ю',b+'я',b+'єм',b+'ї',b+'ю']; }
                if (gender === 'male' && /[бвгджзклмнпрстфхцчшщ]$/.test(x)) return [x,x+'а',x+'у',x+'а',x+'ом',x+'і',x+'е'];
                return [x,x,x,x,x,x,x];
              }

              function patronDecl(s) {
                const x=low(s);
                if (gender==='male' && /ович$/.test(x)) { const b=x.slice(0,-4); return [x,b+'овича',b+'овичу',b+'овича',b+'овичем',b+'овичі',b+'овичу']; }
                if (gender==='male' && /евич$/.test(x)) { const b=x.slice(0,-4); return [x,b+'евича',b+'евичу',b+'евича',b+'евичем',b+'евичі',b+'евичу']; }
                if (gender==='female' && /івна$/.test(x)) { const b=x.slice(0,-4); return [x,b+'івни',b+'івні',b+'івну',b+'івною',b+'івні',b+'івно']; }
                if (gender==='female' && /ївна$/.test(x)) { const b=x.slice(0,-4); return [x,b+'ївни',b+'ївні',b+'ївну',b+'ївною',b+'ївні',b+'ївно']; }
                return [x,x,x,x,x,x,x];
              }

              const s=surnameDecl(surname), n=firstDecl(first), p=patronDecl(patronymic);
              const vals = Array.from({length:7}, (_,i)=>[s[i],n[i],p[i]].filter(Boolean).join(' '));
              return { gender: gender==='female'?'жінка':gender==='male'?'чоловік':'не визначено',
                nominative: full, genitive: vals[1], dative: vals[2], accusative: vals[3], instrumental: vals[4], locative: vals[5], vocative: vals[6] };
            })();
    const labels = ['''

          if old not in text:
              raise SystemExit('Target line not found')
          text = text.replace(old, new, 1)
          text = text.rstrip() + '\n\n' + marker + '\n'
          p.write_text(text, encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          git config user.name "PSK_RECRUTER Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Ukrainian name declension fallback [skip name-cases-fallback]"
          git push
