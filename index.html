<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSK_RECRUTER — CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #101820; color: #fff; }
.hidden { display: none !important; }
#loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #101820; }
.login-box { width: 390px; background: #18232d; padding: 40px; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.logo { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.logo span { color: #b6df4a; }
.subtitle { color: #aeb9c4; margin-bottom: 30px; }
label { display: block; margin: 15px 0 7px; color: #dce3e8; }
input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #3a4650; background: #0f171e; color: white; font-size: 15px; }
button { cursor: pointer; }
.login-button { width: 100%; margin-top: 25px; padding: 14px; border: 0; border-radius: 8px; background: #b6df4a; color: #101820; font-weight: 700; font-size: 16px; }
.login-button:hover { background: #c6ed62; }
.error { margin-top: 15px; color: #ff7777; }
#crmScreen { min-height: 100vh; }
.header { height: 70px; background: #17222c; border-bottom: 1px solid #2c3944; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
.header-logo { font-size: 22px; font-weight: 800; }
.header-logo span { color: #b6df4a; }
.user-area { display: flex; align-items: center; gap: 20px; }
.user-email { color: #b9c3cc; }
.logout { border: 1px solid #4b5965; background: transparent; color: white; padding: 9px 16px; border-radius: 7px; }
.logout:hover { background: #27343f; }
.layout { display: flex; min-height: calc(100vh - 70px); }
.sidebar { width: 240px; background: #131d25; border-right: 1px solid #2c3944; padding: 25px 15px; }
.sidebar-title { color: #7f8b96; font-size: 12px; text-transform: uppercase; margin: 10px 15px; }
.menu-item { padding: 13px 15px; border-radius: 7px; margin-bottom: 5px; color: #d8e0e5; }
.menu-item:hover, .menu-item.active { background: #26343f; color: #b6df4a; }
.content { flex: 1; padding: 35px; }
.page-title { font-size: 30px; margin-bottom: 10px; }
.page-subtitle { color: #8997a3; margin-bottom: 35px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.card { background: #18232d; border: 1px solid #293742; border-radius: 12px; padding: 25px; }
.card-title { color: #8997a3; font-size: 14px; }
.card-number { font-size: 34px; font-weight: 700; margin-top: 10px; }
@media(max-width: 800px) { .sidebar { display: none; } .cards { grid-template-columns: 1fr; } .content { padding: 20px; } }
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="logo">TRO<span>RECRUITER</span></div>
    <div class="subtitle">Внутрішня CRM системи рекрутингу</div>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" placeholder="Введіть email" required>
      <label>Пароль</label>
      <input id="password" type="password" placeholder="Введіть пароль" required>
      <button class="login-button" type="submit">Увійти</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>
<div id="crmScreen" class="hidden">
  <header class="header">
    <div class="header-logo">TRO<span>RECRUITER</span> CRM</div>
    <div class="user-area">
      <div id="userEmail" class="user-email"></div>
      <button id="logoutButton" class="logout">Вийти</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Рекрутинг</div>
      <div class="menu-item active">Головна</div>
      <div class="menu-item">Кандидати</div>
      <div class="menu-item">Нова особова справа</div>
      <div class="menu-item">Документи</div>
      <div class="menu-item">Пошук</div>
      <div class="sidebar-title">Система</div>
      <div class="menu-item">Налаштування</div>
    </aside>
    <main class="content">
      <div class="page-title">Панель рекрутера</div>
      <div class="page-subtitle">Внутрішня система обліку кандидатів</div>
      <div class="cards">
        <div class="card"><div class="card-title">Кандидати</div><div class="card-number">0</div></div>
        <div class="card"><div class="card-title">Особові справи</div><div class="card-number">0</div></div>
        <div class="card"><div class="card-title">Документи</div><div class="card-number">0</div></div>
      </div>
    </main>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://vhfysipxorlhuiaatxqi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_o8ZTKE4Ek0m58zq1q0QpFQ_domIX0Yz';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const loginScreen = document.getElementById('loginScreen');
const crmScreen = document.getElementById('crmScreen');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const userEmail = document.getElementById('userEmail');
const logoutButton = document.getElementById('logoutButton');
function showCRM(user) { loginScreen.classList.add('hidden'); crmScreen.classList.remove('hidden'); userEmail.textContent = user.email || ''; }
function showLogin() { crmScreen.classList.add('hidden'); loginScreen.classList.remove('hidden'); }
loginForm.addEventListener('submit', async function(e) {
  e.preventDefault(); loginError.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { loginError.textContent = 'Невірний email або пароль.'; console.error(error); return; }
  showCRM(data.user);
});
logoutButton.addEventListener('click', async function() { await supabaseClient.auth.signOut(); showLogin(); });
async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) showCRM(session.user); else showLogin();
}
supabaseClient.auth.onAuthStateChange(function(event, session) { if (session && session.user) showCRM(session.user); else showLogin(); });
checkSession();
</script>
<script src="script.js"></script>
</body>
</html>
