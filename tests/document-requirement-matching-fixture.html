<!doctype html><html lang="uk"><meta charset="utf-8"><title>Перевірка розміщення документів — синтетичні дані</title>
<style>body{font:16px system-ui;background:#f3f6f5;color:#20302b;margin:32px;max-width:1100px}h1{font-size:26px}.note{color:#53665e}table{width:100%;border-collapse:collapse;background:white;margin-top:24px}th,td{padding:18px;border:1px solid #d9e3dd;text-align:left;vertical-align:top}th{background:#e4eddf}li{margin:6px 0}.ok{padding:16px;background:#dcefdc;border-radius:10px;font-weight:700}.empty{color:#7e6440}code{font-size:13px}</style>
<h1>Документи кандидата та дітей</h1><p class="note">Синтетична перевірка. Джерела й картки CRM не змінюються.</p><div id="status" class="ok"></div><table><thead><tr><th>Вимога</th><th>Файли</th><th>Стан</th></tr></thead><tbody id="rows"></tbody></table>
<script src="../candidate-conditions.js"></script><script src="../document-presence.js"></script><script src="../document-state.js"></script><script>
const c={has_children:true,children_count:1,profile_data:{service_type:'За контрактом'}},reqs=[{id:'own',document_type:'Свідоцтво про народження',is_required:true},{id:'child',document_type:'Копія свідоцтва про народження дітей',condition_field:'has_children',condition_value:'true',is_required:true},{id:'residence',document_type:'Довідка про місце проживання / Витяг про місце проживання (ДІЯ)',is_required:true}],docs=[{id:'copy-a',file_name:'Актовий запис.pdf',document_type:'Актовий запис про народження'},{id:'copy-b',file_name:'Актовий запис.pdf',document_type:'Актовий запис про народження'},{id:'res',file_name:'Витяг про проживання.pdf',document_type:'Витяг/довідка про зареєстроване місце проживання'}];
const model=CRMDocumentState.displayRows(c,reqs,docs),allIds=model.flatMap(r=>r.files.map(d=>d.id));
const checks=[model.find(r=>r.r.id==='own').files.length===2,model.find(r=>r.r.id==='child').files.length===0,allIds.length===3,new Set(allIds).size===3,model.length===3];
document.querySelector('#status').textContent=(checks.every(Boolean)?'PASS':'FAIL')+' · '+checks.filter(Boolean).length+'/5: документи кандидата окремо від дитячих; повторних рядків немає.';
for(const row of model){const tr=document.createElement('tr');for(const text of [row.r.document_type,row.files.map(d=>d.file_name+' ['+d.id+']').join('\n')||'Не завантажено',row.received?'Файли є · перевірка окремо':'Потрібен окремий документ']){const td=document.createElement('td');td.textContent=text;td.style.whiteSpace='pre-line';tr.append(td);}document.querySelector('#rows').append(tr);}
</script></html>
