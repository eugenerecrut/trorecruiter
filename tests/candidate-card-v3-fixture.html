<script>
window.qaErrors=[];window.addEventListener('error',e=>qaErrors.push(e.message));window.addEventListener('unhandledrejection',e=>qaErrors.push(String(e.reason)));
const initial={id:'test-candidate',full_name:'ТЕСТОВИЙ Олексій Сергійович',name_nominative:'ТЕСТОВИЙ Олексій Сергійович',birth_date:'1990-03-10',phone:'+380671112233',sex:'male',has_children:false,served_before:true,worked_before:true,desired_position:'Водій',recommender_unit:'А0000',responsible_recruiter_id:'qa-user',updated_at:'2026-10-07T12:00:00Z',profile_data:{service_type:'За контрактом',case_mode:'full',identity_document_type:'ID',passport_series:'ЗБЕРЕГТИ',passport_number:'123456789',passport_issuer:'1215',passport_issue_date:'2021-01-02',education_level:'вища',education_institution:'Тестовий університет',education_specialty:'Тестова спеціальність',military_unit:'А0000',service_start_date:'2012-01-01',contract_status:'підготовка',contract_notes:'Приховані дані не видаляти',workflow:{stage:'В роботі'},relatives:[{relationship:'Мати',full_name:'ТЕСТОВА Олена Сергіївна',birth_date:'1965-11-02',deceased:false,death_date:'2012',phone:'+380672223344',source_document_id:'doc-bio'}],work_records:[{kind:'employment',employer:'Тестове підприємство',position:'Водій',start_date:'2019-01-01',end_date:'2020-01-01',order_number:'KEEP',source_document_id:'doc-work'}],education_records:[{degree:'бакалавр',institution:'Тестовий університет',graduation_year:2012,specialty:'Логістика',source_document_id:'doc-edu',source_pages:[1],custom_unedited:'KEEP'}]}};
let candidate=structuredClone(initial),pf={candidate_id:'test-candidate',address:'Тестова адреса'},writes=[];
const docs=[{id:'doc-rl',document_type:'Рекомендаційний лист',file_name:'rl.pdf',storage_path:'test/rl.pdf',verification_status:'Підтверджено',ai_extracted:{full_name:initial.full_name}},{id:'doc-edu',document_type:'Копія диплома',file_name:'diploma.pdf',storage_path:'test/diploma.pdf',verification_status:'Підтверджено'}, {id:'doc-bio',document_type:'Автобіографія',file_name:'bio.pdf',storage_path:'test/bio.pdf'}];
const events=[{action:'candidates_update',source_document_id:'doc-rl',occurred_at:'2026-10-07T12:00:00Z',actor_name:'Тестовий рекрутер',changes:{full_name:{before:'',after:initial.full_name},phone:{before:'',after:initial.phone}}}];
const supabaseClient={from(table){let patch=null,filters=[];const q={select(){return q},eq(k,v){filters.push([k,v]);return q},is(k,v){filters.push([k,v]);return q},order(){return q},limit(){return q},update(p){patch=p;return q},async upsert(p){pf={...pf,...p};writes.push({table,patch:p});return{error:null}},single(){return q},maybeSingle(){return q},then(resolve){let data=table==='candidates'?candidate:table==='personal_files'?pf:table==='documents'?docs:events;if(patch){if(filters.some(([k,v])=>k==='updated_at'&&v!==candidate.updated_at))data=null;else{candidate={...candidate,...patch};writes.push({table,patch});data=candidate;}}return Promise.resolve({data:structuredClone(data),error:null}).then(resolve)}};return q},storage:{from(){return{async createSignedUrl(){return{data:{signedUrl:'about:blank'},error:null}}}}}};
window.CRMResponsibility={latest:ds=>ds.filter(d=>!d.deleted_at),name:()=> 'Тестовий рекрутер',date:v=>v,async mountCard(c,root){root.querySelector('[data-responsibility]').innerHTML='<div class="crm-recruiter-field"><label class="crm-recruiter-label"><span>Закріплений рекрутер</span><select aria-label="Відповідальний рекрутер"><option>Тестовий рекрутер</option></select></label></div><button type="button" data-history>Історія справи</button>';},history(){}};
window.CRMWorkflow={wf:c=>c.profile_data.workflow||{},label:c=>c.profile_data?.workflow?.stage||'Новий'};
window.CRMWorkspace={setContext(id){window.__PSK_CURRENT_CANDIDATE_ID=id},async photo(){return null},async guard(){return true},card:null};
window.CRMCard13={service:(c,p)=>p.service_type||''};
function crmNavigate(key){document.getElementById('qa-result').textContent='Перехід: '+key}
window.escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
localStorage.setItem('crm.candidateCard.version','v3');
</script>
<script src="../candidate-phone.js"></script><script src="../autobiography-document.js"></script><script src="../work-document.js"></script><script src="../candidate-conditions.js"></script><script src="../candidate-name.js"></script><script src="../crm-history-format.js"></script><script src="../candidate-card-v2.js"></script><script src="../name-cases.js"></script><script src="../ai-recommendation-bridge.js"></script><script src="../candidate-card-v3.js"></script>
<script>
openCandidateCard('test-candidate').then(()=>document.getElementById('qa-result').textContent='V3 готова');
document.getElementById('qa-tests').onclick=async()=>{
 let checks=0;const status=document.getElementById('qa-result');const assert=(test,message)=>{if(!test)throw Error(message);checks++};
 try{
 const form=document.getElementById('candidateCardV2');const set=(name,value)=>{const el=form.querySelector('[name="'+name+'"]');el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};const tick=()=>new Promise(r=>setTimeout(r,0));
 assert(form.dataset.cardVersion==='v3','V3 mount');assert(document.querySelectorAll('[role=tab]').length===6,'6 tabs');
 assert(!form.querySelector('#pskRelativesPanel'),'No duplicate relatives bridge');
 document.querySelector('[data-v3-tab=documents]').click();assert(!form.querySelector('[data-section="14"]').hidden,'Documents tab accessible');assert(form.querySelector('[data-open-doc]'),'Original document handlers kept');document.querySelector('[data-v3-tab=main]').click();
 set('case_mode','unit');await tick();assert(document.querySelector('[data-v3-tab=family]').hidden,'Unit case hides family');assert(!form.querySelector('[name=phone]').disabled,'Unit case keeps phone');set('case_mode','full');await tick();assert(!form.querySelector('[name=phone]').disabled,'Full case restores phone');
 assert(form.querySelector('[name=passport_series]').closest('.cc-field').hidden,'ID hides series');
 set('identity_document_type','passport');await tick();assert(!form.querySelector('[name=passport_series]').closest('.cc-field').hidden,'book passport shows series');set('identity_document_type','ID');
 set('served_before','false');await tick();assert(form.querySelector('[name=service_start_date]').closest('.cc-field').hidden,'no service hides fields');set('served_before','true');
 const rel=form.querySelector('[data-relative-row]');assert(!rel.querySelector('details').open,'relative starts folded');rel.querySelector('details').open=true;rel.querySelector('[name=deceased]').value='true';rel.querySelector('[name=deceased]').dispatchEvent(new Event('change',{bubbles:true}));await tick();assert(!rel.querySelector('[name=death_date]').closest('.cc-field').hidden,'death date shown');rel.querySelector('[name=deceased]').value='false';rel.querySelector('[name=deceased]').dispatchEvent(new Event('change',{bubbles:true}));
 document.getElementById('ccAddRelative').click();await tick();const added=[...form.querySelectorAll('[data-relative-row]')].at(-1);assert(added.querySelector('details').open,'new relative editor opens');added.querySelector('[data-remove-relative]').click();await tick();assert(form.querySelectorAll('[data-relative-row]').length===1,'remove relative');assert(document.querySelectorAll('[id]').length===new Set([...document.querySelectorAll('[id]')].map(el=>el.id)).size,'Unique labels after dynamic rows');
 set('has_children','true');await tick();assert(!form.querySelector('[name=children_count]').closest('.cc-field').hidden,'children shown');set('has_children','false');
 set('service_type','За мобілізацією');await tick();assert(form.querySelector('[data-section="11"]').hidden,'mobilization hides contract');set('service_type','За контрактом');
 set('education_level','середня');await tick();assert(form.querySelector('[name=education_specialty]').closest('.cc-field').hidden,'secondary hides specialty');set('education_level','вища');
 assert(form.querySelector('[name=phone]').closest('.cc-field').querySelector('.cc-v3-source'),'AI source shown');set('phone','+380679998877');assert(!form.querySelector('[name=phone]').closest('.cc-field').querySelector('.cc-v3-source'),'manual change removes source');
 const edu=form.querySelector('[data-education-field=institution]');edu.value='Оновлений університет';edu.dispatchEvent(new Event('input',{bubbles:true}));await tick();
 const work=form.querySelector('[name=work_position]');work.value='Старший водій';work.dispatchEvent(new Event('input',{bubbles:true}));
 const saved=await CRMWorkspace.card.save();assert(saved===true,'shared save success');assert(candidate.phone==='+380679998877','phone saved');assert(candidate.profile_data.passport_series==='ЗБЕРЕГТИ','hidden ID series retained');assert(candidate.profile_data.contract_notes==='Приховані дані не видаляти','contract retained');assert(candidate.profile_data.education_records[0].institution==='Оновлений університет','education record saved');assert(candidate.profile_data.education_records[0].custom_unedited==='KEEP','technical metadata retained');assert(candidate.profile_data.work_records[0].position==='Старший водій','work edit saved');assert(candidate.profile_data.work_records[0].order_number==='KEEP','hidden order preserved');assert(candidate.profile_data.relatives[0].death_date==='2012','hidden death date retained');
 await openCandidateCard('test-candidate');assert(document.querySelector('[data-education-field=institution]').value==='Оновлений університет','reopen saved education');assert(document.querySelector('[name=phone]').value==='+380679998877','reopen saved phone');
 candidate.updated_at='2026-10-08T00:00:00Z';const writeCount=writes.length;const conflict=await CRMWorkspace.card.save();assert(conflict===false,'concurrent update blocked');assert(writes.length===writeCount,'conflict does not write');
 document.querySelector('.cc-version-switch').click();await new Promise(r=>setTimeout(r,30));assert(!document.querySelector('.content').classList.contains('cc-v3'),'V2 return');assert(!document.querySelector('[data-education-record]'),'V2 original editor');
 assert(qaErrors.length===0,'JS errors: '+qaErrors.join(';'));status.textContent='PASS · '+checks+' перевірок · JS errors: 0 · тільки mock writes';
 }catch(e){status.textContent='FAIL · '+e.message;console.error(e)}
};
</script></html>
